name: Quality checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'planning-with-files/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'planning-with-files/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:unit
      - run: npm run test:assistant-evaluation
      - run: npm run build
      - run: npm run verify:handoff
      - run: npm run verify:dependency-audit
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Public browser accessibility
        run: |
          CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; process.stdout.write(chromium.executablePath())') npm run test:accessibility-public
      - name: Copied school routes and assistant
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/stu-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; process.stdout.write(chromium.executablePath())') npm run test:school-mirror
