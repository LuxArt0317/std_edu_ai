name: School Affairs announcement email
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: school-affairs-announcement-email
  cancel-in-progress: false
jobs:
  deliver:
    if: vars.ANNOUNCEMENT_EMAIL_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.ANNOUNCEMENT_EMAIL_CRON_SECRET }}
    steps:
      - name: Process a bounded batch of opted-in recipients
        shell: bash
        run: |
          set -euo pipefail
          test "${#CRON_SECRET}" -ge 32
          curl --silent --show-error --fail --max-time 55 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://stu.best/api/affairs-data?resource=announcement-email-delivery'
